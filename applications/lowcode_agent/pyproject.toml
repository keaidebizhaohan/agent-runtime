[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lowcode-agent-runner"
version = "0.1.0"
description = "Lowcode Agent Runner - 从导出的 JSON 配置加载并运行 Agent"
requires-python = ">=3.11.4"
dependencies = [
    "openjiuwen[chromadb,obs]==0.1.8",
    "openjiuwen_studio @ git+https://gitcode.com/openJiuwen/agent-studio.git@feature/runtime#subdirectory=backend",
    "openjiuwen-runtime-service @ git+https://gitcode.com/openJiuwen/agent-runtime.git@develop#subdirectory=service",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
]

[project.scripts]
lowcode-agent-runner = "openjiuwen_runtime.examples.lowcode_agent.__main__:main"

[tool.uv]
default-groups = ['dev']

[dependency-groups]
dev = [
    "coverage==7.8.0",
    "pytest==8.3.5",
    "pytest-asyncio==1.2.0",
    "pytest-mock==3.14.0",
    "ruff==0.9.10",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["*.egg-info", "tests"]
include = ["openjiuwen_runtime*"]
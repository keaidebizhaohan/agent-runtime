[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-runtime-sdk"
version = "0.1.0"
description = "OpenJiuwen Runtime"
requires-python = ">=3.11.4"
dependencies = [
    "openjiuwen==0.1.3",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
]

[tool.uv]
default-groups = ['dev']

[dependency-groups]
dev = [
    "coverage==7.8.0",
    "pytest==8.3.5",
    "pytest-asyncio==1.2.0",
    "pytest-mock==3.14.0",
    "ruff==0.9.10",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.setuptools]
packages = [
    "openjiuwen_runtime.sdk",
    "openjiuwen_runtime.sdk.core",
    "openjiuwen_runtime.sdk.models",
]

[tool.setuptools.package-dir]
"openjiuwen_runtime.sdk" = "src"
"openjiuwen_runtime.sdk.core" = "src/core"
"openjiuwen_runtime.sdk.models" = "src/models"
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime-manager-cli"
version = "0.1.0"
description = "Agent Runtime Manager CLI"
requires-python = ">=3.11.4"
dependencies = [
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    # SDK dependency (local path)
    "openjiuwen-runtime-management-sdk @ file:///${PROJECT_ROOT}/../sdk",
]

[tool.uv]
default-groups = ['dev']

[dependency-groups]
dev = [
    "ruff==0.9.10",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.setuptools]
packages = ["openjiuwen_runtime.cli"]

[tool.setuptools.package-dir]
"openjiuwen_runtime.cli" = "src"

[project.scripts]
agent-runtime-manager = "openjiuwen_runtime.cli.main:cli"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-runtime-management-sdk"
version = "0.1.0"
description = "OpenJiuwen Runtime"
requires-python = ">=3.11.4"
dependencies = [
    "build>=1.0.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.0.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
]

[tool.uv]
default-groups = ['dev']

[dependency-groups]
dev = [
    "coverage==7.8.0",
    "pytest==8.3.5",
    "pytest-asyncio==1.2.0",
    "pytest-mock==3.14.0",
    "ruff==0.9.10",
    "PyYAML>=6.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.setuptools]
packages = ["openjiuwen_runtime.management.sdk"]

[tool.setuptools.package-dir]
"openjiuwen_runtime.management.sdk" = "openjiuwen_runtime/management/sdk"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 关键：添加项目根目录到Python路径
pythonpath = ["."]
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime-manager-server"
version = "1.0.0"
description = "Agent Runtime Manager Server"
requires-python = ">=3.11.4"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    # SDK dependency (local path)
    "openjiuwen-runtime-management-sdk @ file:///${PROJECT_ROOT}/../sdk",
]

[tool.uv]
default-groups = ['dev']

[dependency-groups]
dev = [
    "ruff==0.9.10",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.setuptools]
packages = ["agent_runtime_manager.server"]

[tool.setuptools.package-dir]
"agent_runtime_manager.server" = "src"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-runtime-management"
version = "0.1.0"
description = "OpenJiuwen Runtime"
requires-python = ">=3.11.4"
dependencies = [
    # service
    "build>=1.0.0",
    "aiohttp>=3.9.0",
    # config
    "pyyaml>=6.0",
    # db
    "sqlalchemy>=2.0.0",
    "pymysql>=1.0.0",
    "cryptography>=42.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.19.0",
    "redis>=5.0.0",
    # lint
    "ruff==0.9.10",
    # local dependency
    # "openjiuwen-runtime-foundation @ file:///${PROJECT_ROOT}/../foundation",
    "openjiuwen-runtime-foundation==0.0.1",
]

[tool.uv]
default-groups = ['dev']

[dependency-groups]
dev = [
    # test
    "coverage==7.8.0",
    "pytest==8.3.5",
    "pytest-asyncio==1.2.0",
    "pytest-mock==3.14.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
# url = "https://cn-north-4_a8fea7d0bff7453bab6394a0842d727c_047e5eaae5e442c4b9e79e3032d2d36e:=j1AK^h4uU@devrepo.devcloud.cn-north-4.huaweicloud.com/artgalaxy/api/pypi/cn-north-4_a8fea7d0bff7453bab6394a0842d727c_pypi_5_2/simple"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["*.egg-info", "tests"]
include = ["openjiuwen_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple_agent"
version = "1.0.0"
description = "Simple FastAPI Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[tool.setuptools]
packages = ["simple_agent"]

[project.scripts]
simple_agent = "simple_agent:main"
